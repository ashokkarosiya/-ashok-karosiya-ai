<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>अशोक करोसिया डिजिटल टेक्नोलॉजी - मायरा AI</title>
    <style>
        body {
            margin: 0;
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            position: relative;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.5);
            border: 3px solid #00ffff;
        }
        .container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* चश्मे के लेंस पर कैमरे का ओवरले फ्रेम */
        #camera-overlay {
            position: absolute;
            top: 38%;
            left: 32%`z;
            width: 36%;
            height: 18%;
            border: 2px dashed #00ffff;
            background: rgba(0, 255, 255, 0.15);
            border-radius: 8px;
            overflow: hidden;
        }
        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .status {
            margin-top: 20px;
            font-size: 18px;
            color: #00ffff;
            font-weight: bold;
            text-align: center;
        }
        .btn {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #00ffff;
            color: #0b0f19;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- आपकी मुख्य फोटो (फाइल का नाम photo.png होना चाहिए) -->
        <img src="photo.png" alt="अशोक करोसिया">
        
        <!-- चश्मे के लेंस पर लाइव कैमरा व्यू -->
        <div id="camera-overlay">
            <video id="webcam" autoplay playsinline></video>
        </div>
    </div>

    <div class="status" id="statusText">मायरा AI सक्रिय है... बोलिए!</div>
    <button class="btn" onclick="startMyra()">मायरा से बात करें</button>

    <script>
        // कैमरा शुरू करने का फंक्शन
        async function initCamera() {
            try {
                const videoStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                const webcamElement = document.getElementById('webcam');
                webcamElement.srcObject = videoStream;
            } catch (error) {
                console.log("कैमरा एक्सेस नहीं मिला: ", error);
            }
        }

        // बोलने और आवाज़ सुनने का फंक्शन (Speech Synthesis)
        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'hi-IN'; // हिंदी भाषा
                window.speechSynthesis.speak(utterance);
            }
        }

        function startMyra() {
            speakText("नमस्ते अशोक करोसिया जी, मायरा आपकी सेवा में तैयार है।");
            document.getElementById('statusText').innerText = "सुन रही हूँ...";
        }

        // पेज लोड होते ही कैमरा चालू करें
        window.onload = () => {
            initCamera();
        };
    </script>
</body>
</html>
